---
name: api

services:
  php:
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    image: ${IMAGES_PREFIX:-}app-php
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}, php:80
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      GRAPHHOPPER_BASE_URL: ${GRAPHHOPPER_BASE_URL:-http://routing:8989}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Frontend app URL, embedded in the admin node edit page
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-map}?serverVersion=${POSTGRES_VERSION:-17}&charset=${POSTGRES_CHARSET:-utf8}
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - photo_data:/app/var/photos
    ports:
      - target: 80
        published: ${HTTP_PORT:-8080}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
  routing:
    # The GraphHopper routing stack is not part of the starting point yet.
    # Start it explicitly with: docker compose --profile routing up
    profiles: ["routing"]
    build:
      context: ./routing
    image: accessapp-graphhopper:11.1
    restart: unless-stopped
    ports:
      - target: 8989
        published: ${GRAPHHOPPER_PORT:-8989}
        protocol: tcp
    environment:
      # With the memory-mapped graph (graphhopper.yml) 512m heap is enough
      # for import and serving; total container RAM stays well under 1 GB.
      GRAPHHOPPER_XMX: ${GRAPHHOPPER_XMX:-512m}
      GRAPHHOPPER_REBUILD_GRAPH: ${GRAPHHOPPER_REBUILD_GRAPH:-false}
    volumes:
      - ./routing/graphhopper.yml:/app/graphhopper.yml:ro
      - ./config/map-features.json:/app/map-features.json:ro
      - ./routing/data:/data/osm:ro
      - graphhopper_graphs:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/info | grep -q '\"name\":\"foot_shortest\"' && curl -fsS http://localhost:8989/info | grep -q '\"name\":\"foot_wheelchair\"'"]
      interval: 15s
      timeout: 5s
      start_period: 10m
      retries: 4

  routing-data:
    image: curlimages/curl:8.19.0
    profiles: ["routing-data"]
    user: "0:0"
    entrypoint: ["sh", "/download-data.sh"]
    volumes:
      - ./routing/download-data.sh:/download-data.sh:ro
      - ./routing/data:/data

###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgis/postgis:${POSTGRES_VERSION:-17}-${POSTGIS_VERSION:-3.5}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-map}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-map}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
  photo_data:
  graphhopper_graphs:
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
