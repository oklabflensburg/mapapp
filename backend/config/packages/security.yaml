security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User: 'auto'

    # The EasyAdmin dashboard and all its CRUD routes live under /admin;
    # the login form itself stays public.
    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

    # https://symfony.com/doc/current/security.html#hierarchical-roles
    role_hierarchy:
        ROLE_ADMIN: [ROLE_EDITOR]

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|js|images|assets|build)/
            security: false
        # The EasyAdmin UI is session-based with its own login form, so it
        # stays independent from the stateless-leaning JSON login of the API.
        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            form_login:
                check_path: app_login_form
                login_path: app_login_form
                default_target_path: app_admin
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            access_denied_handler: App\Security\AdminAccessDeniedHandler
            logout:
                path: app_admin_logout
        main:
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
            logout:
                path: /api/logout

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
